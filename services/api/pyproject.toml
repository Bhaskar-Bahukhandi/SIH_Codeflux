[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codeflux-api"
version = "0.1.0"
description = "Backend API foundation for CODEFLUX SIH26034."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "fastapi>=0.115,<1.0",
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "Pillow>=11.0,<13.0",
  "PyJWT>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
