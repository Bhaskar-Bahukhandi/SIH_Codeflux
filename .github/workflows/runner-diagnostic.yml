name: Runner Diagnostic

on:
  push:
    branches:
      - "phase/6-officer-rule-review"
    paths:
      - ".github/workflows/runner-diagnostic.yml"

permissions:
  contents: read

jobs:
  runner-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Confirm runner allocation
        run: echo "runner allocated"
