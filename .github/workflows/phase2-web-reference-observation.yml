name: Phase 2 Web Reference Observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evaluation/phase2/web_reference_sources.csv"
      - "scripts/prepare_phase2_web_reference.py"
      - ".github/workflows/phase2-web-reference-observation.yml"

permissions:
  contents: read

jobs:
  observe-web-reference-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      JWT_SECRET: web-reference-observation-test-secret
      DATABASE_URL: sqlite+pysqlite:///./web-reference-observation.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Download curated official package references
        run: python scripts/prepare_phase2_web_reference.py

      - name: Install API dependencies
        working-directory: services/api
        run: python -m pip install -e ".[dev]"

      - name: Run Phase 2 observation
        working-directory: services/api
        run: |
          python -m app.cli.validate_phase2 \
            --manifest ../../evaluation/phase2/manifest.csv \
            --output ../../evaluation/reports/phase2-web-reference-observation.json

      - name: Verify evidence separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("evaluation/reports/phase2-web-reference-observation.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["dataset_counts"]["web_reference"] < 10:
              raise SystemExit("Expected at least 10 web_reference cases.")
          if report["dataset_counts"]["real_package"] != 0:
              raise SystemExit("Web-reference observation contaminated real_package count.")
          if len(report["web_reference_source_domains"]) < 4:
              raise SystemExit("Expected web references from at least four source domains.")
          print(
              "Observed",
              report["dataset_counts"]["web_reference"],
              "web references from",
              len(report["web_reference_source_domains"]),
              "source domains.",
          )
          PY

      - name: Upload observation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-web-reference-observation
          retention-days: 14
          if-no-files-found: error
          path: |
            evaluation/phase2/manifest.csv
            evaluation/phase2/web_reference_acquisition.json
            evaluation/reports/phase2-web-reference-observation.json
