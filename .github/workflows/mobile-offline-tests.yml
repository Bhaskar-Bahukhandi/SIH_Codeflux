# CI recovery probe after Actions budget removal
name: Mobile Offline Tests

on:
  push:
    branches:
      - main
      - "phase/**"
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-offline-tests.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-offline-tests.yml"

jobs:
  mobile-offline-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test offline foundation
        run: flutter test
