name: Build CODEFLUX OCR Timeout Fix APK

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-fix-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CODEFLUX_DEMO_API_URL: https://codeflux-demo-production.up.railway.app/

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate ephemeral Android runner
        run: |
          cp pubspec.yaml /tmp/codeflux-pubspec.yaml
          cp lib/main.dart /tmp/codeflux-main.dart
          flutter create --platforms=android --org org.sih.codeflux .
          cp /tmp/codeflux-pubspec.yaml pubspec.yaml
          cp /tmp/codeflux-main.dart lib/main.dart
          rm -f analysis_options.yaml test/widget_test.dart

      - name: Keep Android minimum SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          else
            echo "Android app Gradle file not found." >&2
            exit 1
          fi

      - name: Set app label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('android:label="codeflux_mobile"', 'android:label="CODEFLUX"')
          path.write_text(text, encoding="utf-8")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze mobile source
        run: flutter analyze

      - name: Build live-backend debug APK
        run: |
          flutter build apk --debug \
            --dart-define=CODEFLUX_API_URL="$CODEFLUX_DEMO_API_URL"

      - name: Package artifact
        run: |
          mkdir -p build/demo-artifact
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          SAFE_VERSION="${APP_VERSION/+/-build}"
          APK_NAME="CODEFLUX-SIH-demo-${SAFE_VERSION}-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "build/demo-artifact/${APK_NAME}"
          {
            echo "artifact=${APK_NAME}"
            echo "app_version=${APP_VERSION}"
            echo "commit=$GITHUB_SHA"
            echo "api_url=$CODEFLUX_DEMO_API_URL"
            echo "flutter=3.47.5"
            echo "build_type=debug"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build/demo-artifact/build-metadata.txt
          sha256sum "build/demo-artifact/${APK_NAME}" | tee build/demo-artifact/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODEFLUX-OCR-timeout-fix
          path: apps/mobile/build/demo-artifact/
          if-no-files-found: error
          retention-days: 7
