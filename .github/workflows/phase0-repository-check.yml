name: Phase 0 Repository Check

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:

jobs:
  foundation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "CONTRIBUTING.md"
            ".env.example"
            "docs/phase-0/README.md"
            "docs/architecture/README.md"
            "docs/legal/README.md"
            "docs/decisions/0001-technical-baseline.md"
            "apps/mobile/README.md"
            "apps/dashboard/README.md"
            "services/api/README.md"
            "packages/rulepacks/README.md"
            "evaluation/README.md"
            "tests/README.md"
          )

          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required foundation file: $path"; exit 1; }
          done

          echo "Phase 0 foundation structure is present."

      - name: Guard against committed local secrets
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) -not -path "./.git/*" | grep -q .; then
            echo "Potential local secret file committed."
            exit 1
          fi
