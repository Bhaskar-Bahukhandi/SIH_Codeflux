name: Dashboard Tests

on:
  push:
    branches:
      - main
      - "phase/**"
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-tests.yml"

permissions:
  contents: read

jobs:
  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build dashboard
        run: npm run build

  api-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      APP_ENV: test
      JWT_SECRET: test-only-secret-not-for-deployment
      DATABASE_URL: sqlite+pysqlite:///./dashboard-ci-validation.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate migration chain
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run API regression suite
        run: pytest
