name: Phase 4 Web Reference Declaration Observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evaluation/phase2/web_reference_sources.csv"
      - "scripts/prepare_phase2_web_reference.py"
      - "scripts/prepare_phase3_web_reference.py"
      - "scripts/prepare_phase4_web_reference.py"
      - "services/api/app/evaluation/declarations.py"
      - "services/api/app/services/declaration_extractor.py"
      - ".github/workflows/phase4-web-reference-declarations.yml"

permissions:
  contents: read

jobs:
  observe-web-reference-declarations:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      APP_ENV: test
      JWT_SECRET: phase4-web-reference-test-secret
      DATABASE_URL: sqlite+pysqlite:///./phase4-web-reference.sqlite
      OCR_INFERENCE_ENGINE: paddle
      OCR_LANGUAGE: en
      OCR_MODEL_VERSION: PP-OCRv5
      OCR_DETECTION_MODEL_NAME: PP-OCRv5_mobile_det
      OCR_DEVICE: cpu
      OCR_MIN_CONFIDENCE: "0.0"
      OCR_ENABLE_MKLDNN: "false"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Download curated official package references
        run: python scripts/prepare_phase3_web_reference.py

      - name: Install API and pinned OCR runtime
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ocr]"

      - name: Verify PaddlePaddle runtime
        working-directory: services/api
        run: |
          python - <<'PY'
          import paddle
          print("paddlepaddle", paddle.__version__)
          paddle.utils.run_check()
          PY

      - name: Run Phase 3 OCR prerequisite
        working-directory: services/api
        run: |
          timeout --signal=TERM 18m python -m app.cli.validate_ocr \
            --manifest ../../evaluation/phase3/manifest.csv \
            --output ../../evaluation/reports/phase3-web-reference-ocr.json

      - name: Verify OCR prerequisite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("evaluation/reports/phase3-web-reference-ocr.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["successful_case_count"] != 12 or report["failed_case_count"] != 0:
              raise SystemExit(
                  "Phase 4 observation requires 12/12 successful OCR cases."
              )
          PY

      - name: Build unlabeled Phase 4 manifest
        run: python scripts/prepare_phase4_web_reference.py

      - name: Run declaration observation
        working-directory: services/api
        run: |
          python -m app.cli.validate_declarations \
            --manifest ../../evaluation/phase4/manifest.json \
            --output ../../evaluation/reports/phase4-web-reference-declarations.json

      - name: Verify declaration evidence separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "evaluation/reports/phase4-web-reference-declarations.json"
              ).read_text(encoding="utf-8")
          )

          if report["dataset_counts"]["web_reference"] != 12:
              raise SystemExit("Expected exactly 12 web_reference declaration cases.")
          if report["dataset_counts"]["real_package"] != 0:
              raise SystemExit("Web-reference declarations contaminated real_package count.")
          if report["block_source_counts"]["actual_ocr"] != 12:
              raise SystemExit("Expected all 12 cases to use actual OCR blocks.")
          if report["labeled_case_count"] != 0:
              raise SystemExit("Unlabeled observation unexpectedly contains labels.")
          if report["unlabeled_case_count"] != 12:
              raise SystemExit("Expected all 12 declaration cases to remain unlabeled.")
          if report["web_reference_actual_ocr_case_count"] != 12:
              raise SystemExit("Expected 12 web-reference actual-OCR cases.")
          if report["web_reference_actual_ocr_labeled_count"] != 0:
              raise SystemExit("Web-reference observation contaminated labeled metrics.")
          if report["real_package_actual_ocr_case_count"] != 0:
              raise SystemExit("Web-reference observation contaminated real-package gates.")

          overall = report["overall"]
          if any(
              overall[key] != 0
              for key in ("true_positive", "false_positive", "false_negative")
          ):
              raise SystemExit("Unlabeled observations must not alter TP/FP/FN counts.")
          if any(overall[key] is not None for key in ("precision", "recall", "f1")):
              raise SystemExit("Unlabeled observations must not produce accuracy metrics.")

          prediction_count = report[
              "web_reference_actual_ocr_predicted_declaration_count"
          ]
          if prediction_count == 0:
              raise SystemExit(
                  "Declaration observation produced zero supported predictions."
              )

          print(
              "Declaration observation:",
              report["web_reference_actual_ocr_case_count"],
              "actual-OCR web references;",
              prediction_count,
              "supported declaration predictions.",
          )
          PY

      - name: Upload declaration observation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-web-reference-declarations
          retention-days: 14
          if-no-files-found: error
          path: |
            evaluation/phase3/manifest.csv
            evaluation/phase3/web_reference_acquisition.json
            evaluation/reports/phase3-web-reference-ocr.json
            evaluation/phase4/manifest.json
            evaluation/reports/phase4-web-reference-declarations.json
