name: Build CODEFLUX iOS IPA

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios-ipa-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CODEFLUX_DEMO_API_URL: https://codeflux-demo-production.up.railway.app/

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate ephemeral iOS runner
        run: |
          cp pubspec.yaml /tmp/codeflux-pubspec.yaml
          cp lib/main.dart /tmp/codeflux-main.dart
          flutter create --platforms=ios --org org.sih.codeflux .
          cp /tmp/codeflux-pubspec.yaml pubspec.yaml
          cp /tmp/codeflux-main.dart lib/main.dart
          rm -f analysis_options.yaml test/widget_test.dart

      - name: Configure iOS permissions and deployment target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plist = Path("ios/Runner/Info.plist")
          text = plist.read_text(encoding="utf-8")
          if "NSCameraUsageDescription" not in text:
              insertion = """	<key>NSCameraUsageDescription</key>
	<string>CODEFLUX uses the camera to capture package evidence.</string>
	<key>NSPhotoLibraryUsageDescription</key>
	<string>CODEFLUX uses selected package images as inspection evidence.</string>
"""
              text = text.replace("<dict>\n", "<dict>\n" + insertion, 1)
              plist.write_text(text, encoding="utf-8")

          podfile = Path("ios/Podfile")
          pod = podfile.read_text(encoding="utf-8")
          lines = pod.splitlines()
          updated = []
          replaced = False
          for line in lines:
              if line.strip().startswith("# platform :ios") or line.strip().startswith("platform :ios"):
                  updated.append("platform :ios, '15.5'")
                  replaced = True
              else:
                  updated.append(line)
          if not replaced:
              updated.insert(0, "platform :ios, '15.5'")
          podfile.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY

      - name: Resolve dependencies
        run: |
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Analyze mobile source
        run: flutter analyze

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign             --dart-define=CODEFLUX_API_URL="$CODEFLUX_DEMO_API_URL"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios-ipa/Payload/
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          SAFE_VERSION="${APP_VERSION/+/-build}"
          IPA_NAME="CODEFLUX-SIH-demo-${SAFE_VERSION}-unsigned.ipa"
          cd build/ios-ipa
          /usr/bin/zip -qry "${IPA_NAME}" Payload
          rm -rf Payload

          {
            echo "artifact=${IPA_NAME}"
            echo "app_version=${APP_VERSION}"
            echo "commit=$GITHUB_SHA"
            echo "api_url=$CODEFLUX_DEMO_API_URL"
            echo "flutter=3.47.5"
            echo "build_type=release-no-codesign"
            echo "signing=unsigned"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-metadata.txt

          shasum -a 256 "${IPA_NAME}" | tee SHA256SUMS.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CODEFLUX-iOS-unsigned-IPA
          path: apps/mobile/build/ios-ipa/
          if-no-files-found: error
          retention-days: 7
