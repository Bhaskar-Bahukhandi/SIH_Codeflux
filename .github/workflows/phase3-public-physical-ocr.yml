name: Phase 3 Public Physical Package OCR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evaluation/phase2/public_physical_sources.csv"
      - "scripts/prepare_phase2_web_reference.py"
      - "scripts/prepare_phase3_public_physical.py"
      - "services/api/app/services/ocr_engine.py"
      - ".github/workflows/phase3-public-physical-ocr.yml"

permissions:
  contents: read

jobs:
  observe-public-physical-ocr:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      APP_ENV: test
      JWT_SECRET: phase3-public-physical-ocr-test-secret
      DATABASE_URL: sqlite+pysqlite:///./phase3-public-physical.sqlite
      OCR_INFERENCE_ENGINE: paddle
      OCR_LANGUAGE: en
      OCR_MODEL_VERSION: PP-OCRv5
      OCR_DEVICE: cpu
      OCR_MIN_CONFIDENCE: "0.0"
      OCR_DETECTION_MAX_DIMENSION: "960"
      OCR_ENABLE_MKLDNN: "false"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Download licensed physical-package photographs
        run: python scripts/prepare_phase3_public_physical.py

      - name: Install API and pinned OCR runtime
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ocr]"

      - name: Verify PaddlePaddle runtime
        working-directory: services/api
        run: |
          python - <<'PY'
          import paddle
          assert paddle.__version__ == "3.2.2", paddle.__version__
          paddle.utils.run_check()
          PY

      - name: Run real-package OCR observation
        working-directory: services/api
        run: |
          timeout --signal=TERM 18m python -m app.cli.validate_ocr             --manifest ../../evaluation/phase3/manifest.csv             --output ../../evaluation/reports/phase3-public-physical-ocr.json             --require-real-package 6

      - name: Verify execution and ground-truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("evaluation/reports/phase3-public-physical-ocr.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["dataset_counts"]["real_package"] != 6:
              raise SystemExit("Expected six real_package OCR cases.")
          if report["successful_case_count"] != 6:
              raise SystemExit(
                  f"Expected 6/6 successful OCR cases, got "
                  f"{report['successful_case_count']}/6."
              )
          if report["failed_case_count"] != 0:
              raise SystemExit("Physical-package OCR observation recorded failures.")
          if report["real_package_labeled_count"] != 0:
              raise SystemExit("Unreviewed physical photos must not have ground truth.")
          if report["real_package_scored_count"] != 0:
              raise SystemExit("Unreviewed physical photos must not be scored.")
          if report["real_package_mean_character_error_rate"] is not None:
              raise SystemExit("CER must remain unavailable without ground truth.")
          if report["real_package_mean_word_error_rate"] is not None:
              raise SystemExit("WER must remain unavailable without ground truth.")
          if "no_labeled_real_package_cases" not in report["warnings"]:
              raise SystemExit("Missing unlabeled-real-package warning.")

          blocks = sum(len(case["blocks"]) for case in report["cases"])
          if blocks == 0:
              raise SystemExit("OCR returned zero text blocks across physical packages.")

          print(
              "Physical-package OCR observation:",
              report["successful_case_count"],
              "successful cases;",
              blocks,
              "text blocks; CER/WER intentionally unavailable.",
          )
          PY

      - name: Upload OCR observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-public-physical-ocr
          retention-days: 14
          if-no-files-found: error
          path: |
            evaluation/phase3/manifest.csv
            evaluation/phase3/public_physical_acquisition.json
            evaluation/reports/phase3-public-physical-ocr.json
