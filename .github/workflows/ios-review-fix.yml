name: Validate Officer Review iOS Build

on:
  push:
    branches:
      - fix/officer-review-finalize-mobile
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios-review-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CODEFLUX_DEMO_API_URL: https://codeflux-demo-production.up.railway.app/

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate ephemeral iOS runner
        run: |
          cp pubspec.yaml /tmp/codeflux-pubspec.yaml
          cp lib/main.dart /tmp/codeflux-main.dart
          flutter create --platforms=ios --org org.sih.codeflux .
          cp /tmp/codeflux-pubspec.yaml pubspec.yaml
          cp /tmp/codeflux-main.dart lib/main.dart
          rm -f analysis_options.yaml test/widget_test.dart

      - name: Configure iOS permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string CODEFLUX uses the camera to capture package evidence." ios/Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription CODEFLUX uses the camera to capture package evidence." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string CODEFLUX uses selected package images as inspection evidence." ios/Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription CODEFLUX uses selected package images as inspection evidence." ios/Runner/Info.plist

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=CODEFLUX_API_URL="$CODEFLUX_DEMO_API_URL"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios-ipa/Payload/
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          SAFE_VERSION="${APP_VERSION/+/-build}"
          IPA_NAME="CODEFLUX-SIH-demo-${SAFE_VERSION}-unsigned.ipa"
          cd build/ios-ipa
          /usr/bin/zip -qry "${IPA_NAME}" Payload
          rm -rf Payload
          shasum -a 256 "${IPA_NAME}" | tee SHA256SUMS.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CODEFLUX-Officer-review-iOS
          path: apps/mobile/build/ios-ipa/
          if-no-files-found: error
          retention-days: 7
