name: SIH Demo Container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "apps/dashboard/**"
      - "services/api/**"
      - "scripts/prefetch_ocr_models.py"
      - "docs/deployment/**"
      - "docs/validation/README.md"
      - ".github/workflows/demo-container-smoke.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build combined demo image
        run: docker build --tag codeflux-demo:ci .

      - name: Start migrated demo container
        run: |
          docker run --detach \
            --name codeflux-demo \
            --memory 1g \
            --memory-swap 1g \
            --publish 18000:8000 \
            --env APP_ENV=demo \
            --env JWT_SECRET=ci-demo-secret-that-is-longer-than-thirty-two-characters \
            --env DATABASE_URL=sqlite+pysqlite:////tmp/codeflux-demo.sqlite \
            --env MEDIA_ROOT=/tmp/codeflux-media \
            --env PORT=8000 \
            codeflux-demo:ci

      - name: Wait for database readiness
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18000/health/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' codeflux-demo | grep -q true; then
              docker logs codeflux-demo
              exit 1
            fi
            sleep 1
          done
          docker logs codeflux-demo
          exit 1

      - name: Verify API and dashboard from one origin
        run: |
          curl --fail --silent http://127.0.0.1:18000/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18000/ | grep -q 'CODEFLUX'

      - name: Verify pinned OCR runtime is present
        run: |
          docker exec -i codeflux-demo python - <<'PY'
          import paddle
          import paddleocr

          assert paddle.__version__ == "3.2.2", paddle.__version__
          assert paddleocr.__version__ == "3.7.0", paddleocr.__version__
          print("paddlepaddle", paddle.__version__)
          print("paddleocr", paddleocr.__version__)
          PY

      - name: Verify bounded OCR under Railway-sized memory cap
        run: |
          test "$(docker inspect --format '{{.HostConfig.Memory}}' codeflux-demo)" -eq 1073741824

          docker exec -i codeflux-demo python - <<'PY'
          from io import BytesIO

          from PIL import Image, ImageDraw

          from app.core.config import Settings
          from app.services.ocr_engine import build_ocr_engine

          image = Image.new("RGB", (4032, 3024), "white")
          draw = ImageDraw.Draw(image)
          for row in range(10):
              draw.text(
                  (250, 250 + row * 220),
                  f"CODEFLUX PACKAGE LABEL ROW {row} MRP Rs. 50 NET 200 g",
                  fill="black",
              )

          payload = BytesIO()
          image.save(payload, format="JPEG", quality=92)
          del image

          settings = Settings(_env_file=None)
          engine = build_ocr_engine(settings)
          assert engine.parameters["input_max_dimension"] == 1600
          detections = engine.extract(payload.getvalue())
          print("bounded_ocr_blocks", len(detections))
          PY

          curl --fail --silent http://127.0.0.1:18000/health/ready
          test "$(docker inspect --format '{{.State.OOMKilled}}' codeflux-demo)" = "false"

      - name: Verify packaged rule pack
        run: |
          docker exec -i codeflux-demo python - <<'PY'
          from app.services.rule_pack import load_rule_pack

          loaded = load_rule_pack()
          assert loaded.path.exists(), loaded.path
          assert loaded.definition.rule_pack_id
          assert loaded.definition.rules
          print(
              "rule_pack_loaded",
              loaded.definition.rule_pack_id,
              loaded.definition.version,
              len(loaded.definition.rules),
              loaded.sha256,
          )
          PY

      - name: Capture container logs
        if: always()
        run: docker logs codeflux-demo > /tmp/codeflux-container.log 2>&1 || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sih-demo-container-logs
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/codeflux-container.log

      - name: Stop container
        if: always()
        run: docker rm --force codeflux-demo || true
